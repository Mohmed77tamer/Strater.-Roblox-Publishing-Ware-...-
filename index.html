<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strater | Publishing Ware</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@200;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --strater-blue: #007bff; --border: #e0e0e0; --jack-green: #22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
    body { font-family: 'Source Sans 3', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
    .topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between; border-top: 4px solid var(--strater-blue); }
    .app-layout { display: flex; max-width: 1000px; margin: 40px auto; justify-content: center; gap: 20px; }
    .window-container { width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .tabs { display: flex; background: #fff; border: 1px solid var(--border); border-bottom: none; }
    .tab { flex: 1; padding: 14px; font-size: 11px; font-weight: 700; color: #888; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; text-transform: uppercase; font-family: inherit; }
    .tab.active { color: var(--strater-blue); border-bottom-color: var(--strater-blue); }
    .card { background: #fff; border: 1px solid var(--border); padding: 24px; min-height: 580px; position: relative; }
    .panel { display: none; }
    .panel.active { display: block; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 10px; font-weight: 700; color: #555; margin-bottom: 4px; text-transform: uppercase; }
    .field input { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ddd; background: #fafafa; outline: none; font-family: inherit; }
    .btn-primary { width: 100%; padding: 14px; background: var(--strater-blue); color: #fff; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; font-family: inherit; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .log-box { background: #111; height: 460px; overflow-y: auto; padding: 15px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #eee; }
  </style>
</head>
<body>

<div class="topbar">
  <span style="font-weight:600">Strater | Publishing Ware</span>
</div>

<div class="app-layout">
  <div class="window-container">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('universe')">push :D</button>
      <button class="tab" onclick="switchTab('place')">Update :D</button>
      <button class="tab" onclick="switchTab('log')">Log</button>
    </div>

    <div class="card">
      <div id="panel-universe" class="panel active">
        <div class="field">
          <label>Roblosecurity</label>
          <input type="password" id="u-cookie" placeholder=".ROBLOSECURITY token..." />
        </div>
        <div class="field">
          <label>Experience Name</label>
          <input type="text" id="u-name" placeholder="Name" />
        </div>
        <div style="display: flex; gap: 10px;">
          <div class="field" style="flex:2"><label>Template ID</label><input type="text" id="u-template" value="95206881" /></div>
          <div class="field" style="flex:1"><label>Amount</label><input type="number" id="u-count" value="1" /></div>
        </div>
        <button class="btn-primary" id="push-btn" onclick="runUniverses()">push :D</button>
      </div>

      <div id="panel-place" class="panel">
        <div class="field"><label>Target Universe ID</label><input type="text" id="p-universe" /></div>
        <div class="field"><label>API Key</label><input type="password" id="p-api" /></div>
        <div class="field"><label>Source Place ID</label><input type="text" id="p-template" value="95206881" /></div>
        <button class="btn-primary" onclick="runPlaces()" style="background:#111">Update</button>
      </div>

      <div id="panel-log" class="panel">
        <div class="log-box" id="log"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = 'https://ezpublishserv.acc943132.workers.dev/';

  function switchTab(id) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['universe', 'place', 'log'][i] === id));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
  }

  function log(msg, type = 'info') {
    const box = document.getElementById('log');
    const line = document.createElement('div');
    line.innerHTML = `<span style="color:#555">[${new Date().toLocaleTimeString()}]</span> <span style="color:${type === 'err' ? '#ff4d4d' : (type === 'ok' ? '#22c55e' : '#eee')}">${msg}</span>`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  // FIXED: Push function now actually talks to the bridge
  async function runUniverses() {
    const cookie = document.getElementById('u-cookie').value;
    const name = document.getElementById('u-name').value;
    const template = document.getElementById('u-template').value;
    const count = document.getElementById('u-count').value;
    const btn = document.getElementById('push-btn');

    if(!cookie || !name) return alert("Please enter Cookie and Experience Name!");

    btn.disabled = true;
    btn.innerText = "PUSHING...";
    switchTab('log');
    log(`Starting mass push for: ${name}...`, "info");

    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'massPush',
          cookie: cookie,
          name: name,
          templateId: template,
          amount: count
        })
      });

      const result = await response.json();
      log(result.message || "Push request processed.", result.ok ? "ok" : "err");
    } catch (error) {
      log("Critical Error: Could not connect to bridge.", "err");
    } finally {
      btn.disabled = false;
      btn.innerText = "push :D";
    }
  }

  async function runPlaces() {
    // Similar fetch logic for the update panel
    log("Sending update request to bridge...", "info");
  }
</script>
</body>
</html>
