<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strater | Publishing Ware v1.1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@200;400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --strater-blue: #007bff; 
            --strater-err: #ff4757;
            --text: #1e272e; 
            --border: #dfe6e9;
        }

        * { box-sizing: border-box; border-radius: 0 !important; }

        body { 
            background: #f0f2f5; font-family: 'Source Sans 3', sans-serif; 
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }

        #loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; 
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; 
        }
        .spinner { width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid var(--strater-blue); border-radius: 50% !important; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(360deg); } }

        .app-container { display: flex; align-items: stretch; height: 580px; width: 950px; justify-content: center; }

        .drawer { width: 0; background: #fff; border-right: 1px solid var(--border); transition: 0.3s; overflow: hidden; border-top: 5px solid #2f3542; }
        .drawer.open { width: 220px; padding: 20px; }

        .window { background: #fff; width: 460px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border-top: 5px solid var(--strater-blue); display: flex; flex-direction: column; z-index: 5; }

        .item { padding: 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f1f2f6; transition: 0.2s; }
        .item:hover { color: var(--strater-blue); background: #f8f9fa; }

        .toggle-btn { background: var(--strater-blue); color: white; border: none; width: 30px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        .content { padding: 30px; flex-grow: 1; overflow-y: auto; }
        h1 { font-weight: 200; font-size: 40px; margin: 0; letter-spacing: -2px; }
        
        .fade-target { transition: opacity 0.3s, transform 0.3s; }
        .hidden { display: none !important; }

        label { display: block; font-size: 10px; font-weight: 700; color: #a4b0be; text-transform: uppercase; margin-top: 15px; }
        input { width: 100%; border: none; border-bottom: 1px solid var(--border); padding: 8px 0; font-size: 14px; outline: none; background: transparent; }
        
        .file-upload { margin-top: 10px; border: 1px dashed var(--border); padding: 10px; text-align: center; cursor: pointer; font-size: 11px; color: #a4b0be; transition: 0.2s; }
        .file-upload:hover { border-color: var(--strater-blue); color: var(--strater-blue); }

        .btn-push { width: 100%; padding: 16px; background: var(--strater-blue); color: #fff; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 25px; font-family: 'Source Sans 3' !important; }
        #console { margin-top: 15px; font-family: monospace; font-size: 10px; color: #bdc3c7; border-top: 1px solid #f1f2f6; padding-top: 10px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="color:white; margin-top:15px; font-size:10px; letter-spacing:3px;">SYNCING WITH BRIDGE...</div>
    </div>

    <div class="app-container">
        <div id="services" class="drawer">
            <div class="item" onclick="setMode('publish')">Publishing Ware <span>New Creator</span></div>
            <div class="item" onclick="setMode('update')">Update Game <span>Axo Bridge</span></div>
            <div style="margin-top:20px" class="item" onclick="changeFont('Source Sans 3')">Source Sans 3</div>
            <div class="item" onclick="changeFont('Inter')">Inter</div>
        </div>
        <button class="toggle-btn" onclick="toggleDrawer('services')">☰</button>

        <div class="window">
            <div class="content">
                <h1>Strater</h1>
                
                <div id="publish-fields" class="fade-target">
                    <label>Roblosecurity</label>
                    <input type="password" id="cookie" placeholder="Paste .ROBLOSECURITY">
                    
                    <div style="display: flex; gap: 15px;">
                        <div style="flex: 2;"><label>Template ID</label><input type="text" id="tID" value="95206881"></div>
                        <div style="flex: 1;"><label>Amount</label><input type="number" id="amt" value="1"></div>
                    </div>
                    
                    <label>Experience Name</label>
                    <input type="text" id="gName" placeholder="My New Game">
                </div>

                <div id="update-fields" class="fade-target hidden">
                    <label>Universal-ID API</label>
                    <input type="password" id="apiKey" placeholder="Enter API Access Key">
                    
                    <label>Target Universe ID</label>
                    <input type="text" id="uID" placeholder="123456789">
                </div>

                <label>Game Icon (Optional)</label>
                <div class="file-upload" onclick="document.getElementById('iconFile').click()">
                    <span id="file-status">Click to upload JPG/PNG</span>
                    <input type="file" id="iconFile" accept="image/*" style="display:none" onchange="updateFileLabel()">
                </div>

                <button class="btn-push" id="main-btn" onclick="execute()">Initialize Push</button>
                <div id="console">Bridge Ready.</div>
            </div>
        </div>

        <button class="toggle-btn" onclick="toggleDrawer('library')">⚙</button>
        <div id="library" class="drawer">
            <div class="item" onclick="selectT('95206881')">Baseplate</div>
            <div class="item" onclick="selectT('827250212')">Combat Village</div>
        </div>
    </div>

    <script>
        const PREFIX = "_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.|_";
        let currentMode = 'publish';

        function toggleDrawer(id) { document.getElementById(id).classList.toggle('open'); }
        function changeFont(f) { document.querySelector('.window').style.fontFamily = f; }
        function selectT(id) { document.getElementById('tID').value = id; toggleDrawer('library'); }
        function updateFileLabel() {
            const file = document.getElementById('iconFile').files[0];
            document.getElementById('file-status').innerText = file ? `Icon: ${file.name}` : "Click to upload JPG/PNG";
        }

        function setMode(mode) {
            currentMode = mode;
            const isPub = mode === 'publish';
            document.getElementById('publish-fields').classList.toggle('hidden', !isPub);
            document.getElementById('update-fields').classList.toggle('hidden', isPub);
            document.getElementById('main-btn').innerText = isPub ? "push :D" : "update :D";
            toggleDrawer('services');
        }

        async function execute() {
            const log = document.getElementById('console');
            const loader = document.getElementById('loader');
            
            // Validate per mode
            if(currentMode === 'publish') {
                const cookie = document.getElementById('cookie').value;
                const amount = parseInt(document.getElementById('amt').value) || 1;
                const name = document.getElementById('gName').value;

                if(!cookie.startsWith(PREFIX)) return alert("Invalid Roblosecurity :<");
                
                loader.style.display = 'flex';
                
                // New Feature: Loop with auto-incrementing numbers
                for(let i = 1; i <= amount; i++) {
                    const uniqueName = `${name} [${i}]`;
                    log.innerText = `[BRIDGE] Pushing: ${uniqueName}...`;
                    
                    // Call Axo Bridge logic here
                    await new Promise(r => setTimeout(r, 800)); 
                }
                
                alert(`Successfully published ${amount} instances.`);
                document.getElementById('cookie').value = ""; // Trash memory
            } else {
                // Update Logic
                if(!document.getElementById('apiKey').value) return alert("API Key Required");
                loader.style.display = 'flex';
                log.innerText = "syncing update to, universal id.";
                await new Promise(r => setTimeout(r, 1500));
                alert("game updated!");
            }

            loader.style.display = 'none';
            log.innerText = "Operation Complete.";
        }
    </script>
</body>
</html>
