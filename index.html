<!DOCTYPE html>
- inspired by Axo
- Strater's Mod is a little mod that lets you update and import images.
- peak btw
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strater | Publishing Ware</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --strater-blue: #007bff; --border: #e0e0e0; --jack-green: #22c55e; --error-red: #ff4d4d; }
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
    body { font-family: 'Source Sans 3', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
    
    .topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between; border-top: 4px solid var(--strater-blue); }
    .topbar-title { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    .container { max-width: 500px; margin: 40px auto; padding: 0 20px; }
    .tabs { display: flex; background: #fff; border: 1px solid var(--border); border-bottom: none; }
    .tab { flex: 1; padding: 14px; font-size: 11px; font-weight: 700; color: #888; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; text-transform: uppercase; }
    .tab.active { color: var(--strater-blue); border-bottom-color: var(--strater-blue); }

    .card { background: #fff; border: 1px solid var(--border); padding: 24px; min-height: 580px; position: relative; }
    .panel { display: none; }
    .panel.active { display: block; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 10px; font-weight: 800; color: #555; margin-bottom: 4px; text-transform: uppercase; }
    .field input { width: 100%; padding: 12px; font-size: 14px; border: 1px solid #ddd; background: #fafafa; outline: none; font-family: inherit; }
    
    .file-input-wrapper { border: 1px dashed #ccc; padding: 12px; background: #fcfcfc; cursor: pointer; text-align: center; }
    #icon-preview { width: 32px; height: 32px; background: #eee; display: inline-block; vertical-align: middle; margin-right: 10px; object-fit: cover; border: 1px solid #ddd; }

    .status-row { display: flex; align-items: center; gap: 8px; margin: 20px 0 5px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .dot { width: 8px; height: 8px; background: #ddd; }
    .dot.running { background: var(--strater-blue); animation: blink 0.8s infinite; }
    .dot.done { background: var(--jack-green); }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .progress-bar-wrap { height: 2px; background: #eee; margin-bottom: 20px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--strater-blue); width: 0%; transition: width 0.3s; }

    .btn { width: 100%; padding: 14px; font-size: 12px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-primary { background: var(--strater-blue); color: #fff; }
    .btn-primary:disabled { background: #444; cursor: not-allowed; }

    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
    .loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .log-box { background: #111; height: 400px; overflow-y: auto; padding: 15px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #eee; line-height: 1.6; border: 1px solid #333; }
    .log-entry { margin-bottom: 2px; }
    .log-ok { color: var(--jack-green); }
    .log-err { color: var(--error-red); }

    footer { text-align: center; font-size: 10px; color: #999; margin-top: 40px; text-transform: uppercase; letter-spacing: 2px; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">STRATER | PUBLISHING WARE</span>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('universe')">push :D</button>
    <button class="tab" onclick="switchTab('place')">update :D</button>
    <button class="tab" onclick="switchTab('log')">Log</button>
  </div>

  <div class="card">
    <div id="panel-universe" class="panel active">
      <div class="field">
        <label>Roblosecurity</label>
        <input type="password" id="u-cookie" placeholder="Cookie token..." />
      </div>
      
      <div class="field">
        <label>Icon Import</label>
        <div class="file-input-wrapper" onclick="document.getElementById('icon-input').click()">
            <img id="icon-preview" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" />
            <span style="font-size: 10px; font-weight: 700; color: #888;">SELECT IMAGE</span>
            <input type="file" id="icon-input" accept="image/*" style="display:none;" onchange="handleImage(this)" />
        </div>
      </div>

      <div class="field">
        <label>Template ID</label>
        <input type="text" id="u-template" value="95206881" />
      </div>
      
      <div class="row">
        <div class="field"><label>Count</label><input type="number" id="u-count" value="1" /></div>
        <div class="field"><label>Delay (s)</label><input type="number" id="u-delay" value="1" step="0.5" /></div>
      </div>

      <div class="status-row"><div class="dot" id="u-dot"></div><span id="u-status">Ready</span></div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="u-bar"></div></div>
      
      <button class="btn btn-primary" id="u-btn" onclick="runUniverses()">
        <div class="spinner"></div>
        <span class="btn-text">push :D</span>
      </button>
    </div>

    <div id="panel-place" class="panel">
        <div class="field"><label>Universal-Places API Key</label><input type="password" id="p-api" placeholder="Key..." /></div>
        <div class="field"><label>Target Universe ID</label><input type="text" id="p-universe" placeholder="ID..." /></div>
        <div class="field"><label>Template Place ID</label><input type="text" id="p-template" value="95206881" /></div>
        <div class="status-row"><div class="dot" id="p-dot"></div><span id="p-status">Ready</span></div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="p-bar"></div></div>
        <button class="btn btn-primary" id="p-btn" onclick="runPlaces()">
            <div class="spinner"></div>
            <span class="btn-text">update :D</span>
        </button>
    </div>

    <div id="panel-log" class="panel">
      <div class="log-box" id="log"></div>
      <button onclick="document.getElementById('log').innerHTML=''" style="background:none; border:none; color:#aaa; font-size:9px; cursor:pointer; margin-top:8px; font-family:'JetBrains Mono'">[ CLEAR TERMINAL ]</button>
    </div>
  </div>
  <footer>Strater Publishing Ware</footer>
</div>

<script>
  const WORKER_URL = 'https://ezpublishserv.acc943132.workers.dev/';
  let running = false;
  let base64Icon = null;

  function handleImage(input) {
    const file = input.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        base64Icon = e.target.result;
        document.getElementById('icon-preview').src = base64Icon;
        log("Icon loaded.", "info");
      };
      reader.readAsDataURL(file);
    }
  }

  function switchTab(id) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['universe', 'place', 'log'][i] === id));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
  }

  function log(msg, type = 'info') {
    const box = document.getElementById('log');
    const line = document.createElement('div');
    line.className = `log-entry log-${type}`;
    line.innerHTML = `<span style="color:#666">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  async function runUniverses() {
    const btn = document.getElementById('u-btn');
    const cookieEl = document.getElementById('u-cookie');
    if(!cookieEl.value) return alert("Missing Cookie");

    running = true;
    switchTab('log');
    btn.classList.add('loading');
    btn.disabled = true;

    const count = parseInt(document.getElementById('u-count').value);
    for (let i = 1; i <= count; i++) {
      if (!running) break;
      document.getElementById('u-dot').className = 'dot running';
      try {
        const resp = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            action: 'createUniverse', 
            cookie: cookieEl.value.trim(), 
            templateId: document.getElementById('u-template').value,
            iconData: base64Icon 
          })
        });
        const res = await resp.json();
        log(`[${i}/${count}] ${res.message}`, res.ok ? 'ok' : 'err');
      } catch (e) { log("Bridge Error", "err"); }
      
      document.getElementById('u-bar').style.width = (i / count * 100) + '%';
      if (i < count && running) await new Promise(r => setTimeout(r, document.getElementById('u-delay').value * 1000));
    }

    btn.classList.remove('loading');
    btn.disabled = false;
    document.getElementById('u-dot').className = 'dot done';
    running = false;
    cookieEl.value = ''; 
  }

  async function runPlaces() {
    const btn = document.getElementById('p-btn');
    if(!document.getElementById('p-api').value) return alert("Missing API Key");
    running = true;
    switchTab('log');
    btn.classList.add('loading');
    btn.disabled = true;
    try {
        const resp = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'updateUniversalPlace',
                apiKey: document.getElementById('p-api').value,
                universeId: document.getElementById('p-universe').value,
                templateId: document.getElementById('p-template').value
            })
        });
        const res = await resp.json();
        log(`[Update] ${res.message}`, res.ok ? 'ok' : 'err');
    } catch (e) { log("Error", "err"); }
    btn.classList.remove('loading');
    btn.disabled = false;
    running = false;
  }
</script>
</body>
</html>
